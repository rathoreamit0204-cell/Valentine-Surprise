<body class="index-bg">

<div class="hearts"></div>

<!-- Background Music -->
<audio id="bgMusic" src="music.mp3" loop autoplay></audio>

<!-- PASSWORD SCREEN -->
<div id="passwordScreen" class="password-wrapper">
  <h2>Enter Our Secret Password 🔐</h2>
  <input type="password" id="passwordInput" placeholder="Our Special Date">
  <button onclick="checkPassword()">Unlock 💖</button>
</div>

<!-- MAIN CONTENT -->
<div id="mainContent" style="display:none;">

  <div class="countdown">
    <h3>Countdown to Valentine's Day ⏳</h3>
    <p id="timer"></p>
  </div>

  <div class="question-wrapper">
    <h1 id="question"></h1>
    <div id="answers"></div>
  </div>

</div>

<script src="script.js"></script>
</body>
